<div
  class="file-input-zone"
  [class.file-input-zone--dragging]="isDragging()"
  [class.file-input-zone--disabled]="disabled()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
  role="region"
  aria-label="Document file input zone"
>
  <div class="file-input-zone__inner">
    <span class="file-input-zone__icon" aria-hidden="true">📄</span>
    <p class="file-input-zone__label">
      Drag &amp; drop documentation files here, or
    </p>
    <button
      type="button"
      class="btn btn--outline"
      (click)="openFilePicker()"
      [disabled]="disabled()"
      aria-label="Browse for documentation files"
    >
      Browse Files
    </button>
    <p class="file-input-zone__hint">
      Supported: .md, .txt, .pdf
    </p>
  </div>
</div>

@if (files().length > 0) {
  <ul class="file-list" role="list" aria-label="Selected documentation files">
    @for (file of files(); track file.path; let i = $index) {
      <li class="file-list__item">
        <span class="file-list__icon" aria-hidden="true">
          {{ file.name.endsWith('.pdf') ? '📕' : '📝' }}
        </span>
        <span class="file-list__name" [title]="file.path">
          {{ file.name }}
        </span>
        <button
          type="button"
          class="file-list__remove"
          (click)="removeFile(i)"
          [disabled]="disabled()"
          [attr.aria-label]="'Remove ' + file.name"
        >
          ✕
        </button>
      </li>
    }
  </ul>
}
